<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nature's Platter</title>

    <!-- tailwind -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- font awsome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <header class="md:pt-6">
      <nav class="flex justify-around container mx-auto">
        <div class="hidden md:block">
          <img src="./assets/nav-logo.png" alt="logo" class="h-10 md:h-15" />
        </div>

        <ul class="hidden md:flex gap-4 items-center">
          <li><a href="">Product</a></li>
          <li><a href="">Services</a></li>
          <li><a href="">Contact us</a></li>
        </ul>
        <div class="hidden md:flex items-center gap-4">
          <span><i class="fa-solid fa-magnifying-glass"></i></span>
          <span><i class="fa-solid fa-cart-shopping"></i></span>
          <button
            class="rounded border border-green-500 font-semibold px-8 py-2"
          >
            Login
          </button>
          <button
            class="rounded bg-green-500 font-semibold px-8 py-2 text-white"
          >
            Register
          </button>
        </div>
        <!-- mobile device -->
        <div
          class="md:hidden flex justify-between items-center w-full px-4 py-2 border-b text-[#179800]"
        >
          <img src="./assets/Group.png" alt="" />
          <i class="fa-solid fa-bars"></i>
        </div>
      </nav>
      <!-- end nav  -->

      <!-- start hero section -->
      <section class="text-center py-20">
          <div class=" xl:w-[40%] mx-auto px-5 xl: p-0">
            <h2 class="font-bold text-3xl md:text-5xl">Freshness <span class="text-[#179800]">You Can <br> Count</span> On, Prices You’ll Love!</h2>
          <p class="pt-3 md:pt-8">Shop your daily essentials at unbeatable prices. From fresh produce to pantry <br> staples, we’ve got you covered every day!</p>
          </div>
          <img src="./assets/Hero Section 1.png" alt="" class="mx-auto  xl:max-w-165 pt-9">
      </section>
    </header>
  </body>
</html>
